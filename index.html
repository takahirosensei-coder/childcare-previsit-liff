<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見学事前シート｜チャイルドケアサポート</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .eyebrow {
      margin-bottom: 10px;
      color: #70856f;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      line-height: 1.4;
    }

    .status {
      margin-bottom: 28px;
      color: #666;
      font-size: 15px;
      line-height: 1.8;
    }

    .loading {
      padding: 22px 0;
      color: #777;
      font-size: 15px;
      line-height: 1.8;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fff3f3;
      color: #9b3d3d;
      font-size: 14px;
      line-height: 1.7;
    }

    .application {
      display: none;
    }

    .section-title {
      margin: 28px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8e5df;
      color: #70856f;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .info-row {
      padding: 11px 0;
      border-bottom: 1px solid #f0eee9;
    }

    .info-label {
      margin-bottom: 5px;
      color: #888;
      font-size: 12px;
    }

    .info-value {
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }

    .notice {
      margin-top: 26px;
      padding: 16px;
      border-radius: 12px;
      background: #f3f6f1;
      color: #526151;
      font-size: 14px;
      line-height: 1.8;
    }
    .input-row {
  padding: 18px 0;
  border-bottom: 1px solid #f0eee9;
}

.input-label {
  display: block;
  margin-bottom: 10px;
  color: #555;
  font-size: 14px;
  font-weight: 600;
}

.choice-group {
  display: flex;
  gap: 10px;
}

.choice-button {
  flex: 1;
  cursor: pointer;
}

.choice-button input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice-button span {
  display: block;
  padding: 13px 12px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 15px;
  transition: 0.2s;
}

.choice-button input:checked + span {
  border-color: #70856f;
  background: #f0f4ee;
  color: #526151;
  font-weight: 600;
}

textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: #70856f;
}

.conditional {
  display: none;
}
    select,
input[type="text"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
}

select:focus,
input[type="text"]:focus {
  outline: none;
  border-color: #70856f;
}

select:disabled {
  background: #f5f4f1;
  color: #aaa;
}

.auto-value {
  padding: 13px;
  border-radius: 10px;
  background: #f3f6f1;
  color: #526151;
  font-size: 14px;
  line-height: 1.6;
}
    .weekday-group {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
}

.weekday-button {
  cursor: pointer;
}

.weekday-button input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.weekday-button span {
  display: block;
  padding: 12px 0;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 14px;
}

.weekday-button input:checked + span {
  border-color: #70856f;
  background: #f0f4ee;
  color: #526151;
  font-weight: 600;
}

input[type="time"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
}

input[type="time"]:focus {
  outline: none;
  border-color: #70856f;
}

.subsection-title {
  margin-top: 26px;
  padding: 10px 12px;
  border-left: 4px solid #70856f;
  background: #f5f6f2;
  color: #526151;
  font-size: 15px;
  font-weight: 600;
}
    
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="eyebrow">
        CHILD CARE SUPPORT / PRE-VISIT SHEET
      </div>

      <h1>見学事前シート</h1>

      <div id="status" class="status">
        LINEとの接続を確認しています…
      </div>

      <div id="loading" class="loading">
        見学申込情報を確認しています…
      </div>

      <div id="error" class="error"></div>

      <div id="application" class="application">

        <div class="section-title">
  01　お子さまについて
</div>

<div class="info-row">
  <div class="info-label">お子さま氏名</div>
  <div id="childName" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">生年月日</div>
  <div id="birthDate" class="info-value"></div>
</div>

<div id="nurseryTemporary" style="display:none;">
  <div id="nursery"></div>
</div>
<div class="input-row">
  <div class="input-label">性別</div>
  <div class="choice-group">
    <label class="choice-button">
      <input type="radio" name="gender" value="男児">
      <span>男児</span>
    </label>

    <label class="choice-button">
      <input type="radio" name="gender" value="女児">
      <span>女児</span>
    </label>
  </div>
</div>

<div class="input-row">
  <div class="input-label">アレルギー</div>
  <div class="choice-group">
    <label class="choice-button">
      <input type="radio" name="allergy" value="なし">
      <span>なし</span>
    </label>

    <label class="choice-button">
      <input type="radio" name="allergy" value="あり">
      <span>あり</span>
    </label>
  </div>
</div>

<div id="allergyDetailArea" class="input-row conditional">
  <label class="input-label" for="allergyDetail">
    アレルギーの詳細
  </label>

  <textarea
    id="allergyDetail"
    rows="3"
    placeholder="例：卵、乳製品 など"
  ></textarea>
</div>
        <div class="section-title">
  02　ご住所について
</div>

<div class="input-row">

 <select id="prefecture">

    <option value="群馬県">群馬県</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>

    <option value="山梨県">山梨県</option>

    <option value="長崎県">長崎県</option>
    <option value="熊本県">熊本県</option>
    <option value="大分県">大分県</option>

    <option value="沖縄県">沖縄県</option>
  </optgroup>
</select>
</div>

<div class="input-row">
  <label class="input-label">
    市区町村
  </label>

  <!-- 東京都・埼玉県・千葉県の場合 -->
  <select id="citySelect" disabled>
    <option value="">都道府県を先に選択してください</option>
  </select>

  <!-- その他の道府県の場合 -->

    type="text"

<div class="input-row">
  <label class="input-label" for="addressDetail">

<div class="section-title">
  03　ご希望の保育について

</div>

</div>

  <div id="desiredEntryDisplay" class="info-value"></div>
</div>

<div class="input-row">
  <div class="input-label">希望曜日</div>

  <div class="weekday-group">

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="月">
      <span>月</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="火">
      <span>火</span>
    </label>

    <label class="weekday-button">

    <label class="weekday-button">

</div>

<div class="input-row">

</div>

<div class="input-row">

    <option value="情報収集中">情報収集中</option>
    <option value="その他">その他</option>
  </select>
</div>

    async function initializeLiff() {

      const status =
        document.getElementById('status');

      const loading =
        document.getElementById('loading');

      const errorBox =
        document.getElementById('error');

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        const profile =
          await liff.getProfile();


        status.textContent =
          'LINEとの接続に成功しました。';


        const url =
          API_URL +
          '?action=getVisitApplication' +
          '&lineUserId=' +
          encodeURIComponent(profile.userId);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            '見学申込情報の取得に失敗しました。'
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            '見学申込情報が見つかりませんでした。'
          );

        }


        showApplication(
          result.application
        );


        loading.style.display =
          'none';


      } catch (error) {

        console.error(error);

        loading.style.display =
          'none';

        errorBox.style.display =
          'block';

        errorBox.textContent =
          error.message ||
          '情報の取得中にエラーが発生しました。';

      }

    }

    function formatDate(value) {

      if (!value) {
        return '—';
      }

      const parts =
        value.split('-');

      if (parts.length !== 3) {
        return value;
      }

      return (
        Number(parts[0]) +
        '年' +
        Number(parts[1]) +
        '月' +
        Number(parts[2]) +
        '日'
      );

applicantWorkPrefecture.addEventListener('change', function() {

  const prefecture = this.value;

  applicantWorkCitySelect.innerHTML =
    '<option value="">選択してください</option>';

  applicantWorkCityInput.value = '';

  if (cityData[prefecture]) {

    applicantWorkCitySelect.style.display = 'block';
    applicantWorkCitySelect.disabled = false;
    applicantWorkCityInput.style.display = 'none';

    cityData[prefecture].forEach(function(city) {

      const option =
        document.createElement('option');

      option.value = city;
      option.textContent = city;

      applicantWorkCitySelect.appendChild(option);

    });

  } else if (!prefecture) {

    applicantWorkCitySelect.style.display = 'block';
    applicantWorkCitySelect.disabled = true;

    applicantWorkCitySelect.innerHTML =
      '<option value="">都道府県を先に選択してください</option>';

    applicantWorkCityInput.style.display = 'none';

  } else {

    applicantWorkCitySelect.style.display = 'none';
    applicantWorkCitySelect.disabled = true;
    applicantWorkCityInput.style.display = 'block';

  }

});
