<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見学事前シート｜チャイルドケアサポート</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .eyebrow {
      margin-bottom: 10px;
      color: #70856f;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
      line-height: 1.4;
    }

    .status {
      margin-bottom: 28px;
      color: #666;
      font-size: 15px;
      line-height: 1.8;
    }

    .loading {
      padding: 22px 0;
      color: #777;
      font-size: 15px;
      line-height: 1.8;
    }

    .error {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fff3f3;
      color: #9b3d3d;
      font-size: 14px;
      line-height: 1.7;
    }

    .application {
      display: none;
    }

    .section-title {
      margin: 28px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8e5df;
      color: #70856f;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .info-row {
      padding: 11px 0;
      border-bottom: 1px solid #f0eee9;
    }

    .info-label {
      margin-bottom: 5px;
      color: #888;
      font-size: 12px;
    }

    .info-value {
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }

    .notice {
      margin-top: 26px;
      padding: 16px;
      border-radius: 12px;
      background: #f3f6f1;
      color: #526151;
      font-size: 14px;
      line-height: 1.8;
    }
    .input-row {
  padding: 18px 0;
  border-bottom: 1px solid #f0eee9;
}

.input-label {
  display: block;
  margin-bottom: 10px;
  color: #555;
  font-size: 14px;
  font-weight: 600;
}

.choice-group {
  display: flex;
  gap: 10px;
}
    /* 05 その他：選択肢をスマホで2列表示 */
#section05 .choice-group {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

#section05 .choice-button {
  min-width: 0;
}

#section05 .choice-button span {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: normal;
  word-break: keep-all;
}

.choice-button {
  flex: 1;
  cursor: pointer;
}

.choice-button input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice-button span {
  display: block;
  padding: 13px 12px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 15px;
  transition: 0.2s;
}

.choice-button input:checked + span {
  border-color: #70856f;
  background: #f0f4ee;
  color: #526151;
  font-weight: 600;
}

textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: #70856f;
}

.conditional {
  display: none;
}
    #applicantWorkDetails,
#otherParentWorkDetails {
  display: none;
}
    select,
input[type="text"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
}

select:focus,
input[type="text"]:focus {
  outline: none;
  border-color: #70856f;
}

select:disabled {
  background: #f5f4f1;
  color: #aaa;
}

.auto-value {
  padding: 13px;
  border-radius: 10px;
  background: #f3f6f1;
  color: #526151;
  font-size: 14px;
  line-height: 1.6;
}
    .weekday-group {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
}

.weekday-button {
  cursor: pointer;
}

.weekday-button input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.weekday-button span {
  display: block;
  padding: 12px 0;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-size: 14px;
}

.weekday-button input:checked + span {
  border-color: #70856f;
  background: #f0f4ee;
  color: #526151;
  font-weight: 600;
}

input[type="time"] {
  width: 100%;
  padding: 13px;
  border: 1px solid #d9d6cf;
  border-radius: 10px;
  background: #fff;
  color: #333;
  font: inherit;
  font-size: 16px;
}

input[type="time"]:focus {
  outline: none;
  border-color: #70856f;
}

.subsection-title {
  margin-top: 26px;
  padding: 10px 12px;
  border-left: 4px solid #70856f;
  background: #f5f6f2;
  color: #526151;
  font-size: 15px;
  font-weight: 600;
}
  /* ==================================================
   デザイン調整
   ミントグリーン × ホワイト
================================================== */

/* 全体背景 */
body {
  background: #d9f0ed;
  color: #252d2c;
}


/* メインカード */
.card {
  background: #ffffff;

  border: none;
  border-radius: 26px;

  box-shadow:
    0 18px 45px rgba(35, 105, 91, 0.15);
}


/* 上部英字 */
.eyebrow {
  color: #148b78;
  font-weight: 700;
}


/* メインタイトル */
h1 {
  color: #148b78;

  font-weight: 750;
  letter-spacing: 0.02em;
}


/* LINE接続表示 */
.status {
  color: #505a58;
}


/* ==================================================
   セクション見出し
================================================== */

.section-title {
  margin-top: 38px;
  margin-bottom: 20px;

  padding: 0 0 11px;

  border: none;
  border-bottom: 2px solid #cce7e2;

  border-radius: 0;

  background: transparent;

  color: #148b78;

  font-size: 16px;
  font-weight: 750;

  letter-spacing: 0.04em;
}


/* ==================================================
   申込時の情報
================================================== */

.info-row {
  padding: 14px 4px;

  border-bottom: 1px solid #e6e9e8;
}


.info-label {
  margin-bottom: 6px;

  color: #747d7b;

  font-size: 12px;
  font-weight: 600;
}


.info-value {
  color: #252d2c;

  font-size: 16px;
  font-weight: 650;
}


/* ==================================================
   入力項目
================================================== */

.input-row {
  padding: 19px 0;

  border-bottom: none;
}


.input-label {
  color: #252d2c;

  font-size: 14px;
  font-weight: 650;
}


/* 入力欄 */
select,
input[type="text"],
input[type="date"],
input[type="time"],
textarea {

  border: 1px solid transparent;
  border-radius: 10px;

  background: #f2f4f3;

  color: #252d2c;

  box-shadow: none;

  transition:
    border-color 0.2s,
    background 0.2s,
    box-shadow 0.2s;
}


/* 入力欄を操作している時 */
select:focus,
input[type="text"]:focus,
input[type="date"]:focus,
input[type="time"]:focus,
textarea:focus {

  outline: none;

  background: #ffffff;

  border-color: #148b78;

  box-shadow:
    0 0 0 3px rgba(20, 139, 120, 0.13);
}


/* ==================================================
   選択ボタン
================================================== */

.choice-button span,
.weekday-button span {

  border: 1px solid transparent;

  background: #f2f4f3;

  color: #35403e;

  font-weight: 550;

  transition: all 0.18s ease;
}


/* 選択済み */
.choice-button input:checked + span,
.weekday-button input:checked + span {

  border-color: #148b78;

  background: #148b78;

  color: #ffffff;

  font-weight: 700;

  box-shadow:
    0 6px 15px rgba(20, 139, 120, 0.20);
}


/* ==================================================
   お父さま・お母さま等の小見出し
================================================== */

.subsection-title {

  margin-top: 32px;

  padding: 13px 15px;

  border: none;
  border-radius: 10px;

  background: #e6f3f0;

  color: #107c6b;

  font-weight: 700;
}


/* ==================================================
   無効状態
================================================== */

select:disabled {

  background: #eceeed;

  color: #9aa19f;
}
    /* ==================================================
   確認ボタン
================================================== */

.submit-area {
  margin-top: 36px;
  padding-top: 8px;
}

.confirm-button {
  width: 100%;
  padding: 17px 20px;
  border: none;
  border-radius: 12px;
  background: #148b78;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(20, 139, 120, 0.20);
}

.confirm-button:active {
  transform: translateY(1px);
  box-shadow: 0 4px 12px rgba(20, 139, 120, 0.18);
}
    /* ==================================================
   確認画面
================================================== */

.confirm-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 28px;
}

.back-button {
  width: 100%;
  padding: 16px 20px;
  border: 1px solid #148b78;
  border-radius: 12px;
  background: #ffffff;
  color: #148b78;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="eyebrow">
        CHILD CARE SUPPORT / PRE-VISIT SHEET
      </div>

      <h1>見学事前シート</h1>

      <div id="status" class="status">
        LINEとの接続を確認しています…
      </div>

      <div id="loading" class="loading">
        見学申込情報を確認しています…
      </div>

      <div id="error" class="error"></div>

      <div id="application" class="application">

        <div class="section-title">
  01　お子さまについて
</div>

<div class="info-row">
  <div class="info-label">お子さま氏名</div>
  <div id="childName" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">生年月日</div>
  <div id="birthDate" class="info-value"></div>
</div>


<div class="input-row">
  <div class="input-label">性別</div>
  <div class="choice-group">
    <label class="choice-button">
      <input type="radio" name="gender" value="男児">
      <span>男児</span>
    </label>

    <label class="choice-button">
      <input type="radio" name="gender" value="女児">
      <span>女児</span>
    </label>
  </div>
</div>

<div class="input-row">
  <div class="input-label">アレルギー</div>
  <div class="choice-group">
    <label class="choice-button">
      <input type="radio" name="allergy" value="なし">
      <span>なし</span>
    </label>

    <label class="choice-button">
      <input type="radio" name="allergy" value="あり">
      <span>あり</span>
    </label>
  </div>
</div>

<div id="allergyDetailArea" class="input-row conditional">
  <label class="input-label" for="allergyDetail">
    アレルギーの詳細
  </label>

  <textarea
    id="allergyDetail"
    rows="3"
    placeholder="例：卵、乳製品 など"
  ></textarea>
</div>
        <div class="section-title">
  02　ご住所について
</div>

<div class="input-row">
  <label class="input-label" for="prefecture">
    都道府県
  </label>

 <select id="prefecture">
  <option value="">選択してください</option>

  <optgroup label="よく選択される地域">
    <option value="東京都">東京都</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>
  </optgroup>

  <optgroup label="──────────" disabled>
  </optgroup>

  <optgroup label="北海道">
    <option value="北海道">北海道</option>
  </optgroup>

  <optgroup label="東北">
    <option value="青森県">青森県</option>
    <option value="岩手県">岩手県</option>
    <option value="宮城県">宮城県</option>
    <option value="秋田県">秋田県</option>
    <option value="山形県">山形県</option>
    <option value="福島県">福島県</option>
  </optgroup>

  <optgroup label="関東">
    <option value="茨城県">茨城県</option>
    <option value="栃木県">栃木県</option>
    <option value="群馬県">群馬県</option>
    <option value="埼玉県">埼玉県</option>
    <option value="千葉県">千葉県</option>
    <option value="東京都">東京都</option>
    <option value="神奈川県">神奈川県</option>
  </optgroup>

  <optgroup label="中部">
    <option value="新潟県">新潟県</option>
    <option value="富山県">富山県</option>
    <option value="石川県">石川県</option>
    <option value="福井県">福井県</option>
    <option value="山梨県">山梨県</option>
    <option value="長野県">長野県</option>
    <option value="岐阜県">岐阜県</option>
    <option value="静岡県">静岡県</option>
    <option value="愛知県">愛知県</option>
  </optgroup>

  <optgroup label="近畿">
    <option value="三重県">三重県</option>
    <option value="滋賀県">滋賀県</option>
    <option value="京都府">京都府</option>
    <option value="大阪府">大阪府</option>
    <option value="兵庫県">兵庫県</option>
    <option value="奈良県">奈良県</option>
    <option value="和歌山県">和歌山県</option>
  </optgroup>

  <optgroup label="中国">
    <option value="鳥取県">鳥取県</option>
    <option value="島根県">島根県</option>
    <option value="岡山県">岡山県</option>
    <option value="広島県">広島県</option>
    <option value="山口県">山口県</option>
  </optgroup>

  <optgroup label="四国">
    <option value="徳島県">徳島県</option>
    <option value="香川県">香川県</option>
    <option value="愛媛県">愛媛県</option>
    <option value="高知県">高知県</option>
  </optgroup>

  <optgroup label="九州・沖縄">
    <option value="福岡県">福岡県</option>
    <option value="佐賀県">佐賀県</option>
    <option value="長崎県">長崎県</option>
    <option value="熊本県">熊本県</option>
    <option value="大分県">大分県</option>
    <option value="宮崎県">宮崎県</option>
    <option value="鹿児島県">鹿児島県</option>
    <option value="沖縄県">沖縄県</option>
  </optgroup>
</select>
</div>

<div class="input-row">
  <label class="input-label">
    市区町村
  </label>

  <!-- 東京都・埼玉県・千葉県の場合 -->
  <select id="citySelect" disabled>
    <option value="">都道府県を先に選択してください</option>
  </select>

  <!-- その他の道府県の場合 -->
  <input
    type="text"
    id="cityInput"
    placeholder="市区町村を入力してください"
    style="display:none;"
  >
</div>
<div class="input-row">
  <label class="input-label" for="addressDetail">
    町名・番地・建物名
  </label>

  <input
    type="text"
    id="addressDetail"
    placeholder="例：梅島1-2-3 ○○マンション101"
  >
</div>

<div class="section-title">
  03　ご希望の保育について
</div>

<div class="info-row">
  <div class="info-label">見学先</div>
  <div id="nurseryDisplay" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">希望クラス</div>
  <div id="desiredClassDisplay" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">入園希望時期</div>
  <div id="desiredEntryDisplay" class="info-value"></div>
</div>

<div class="input-row">
  <div class="input-label">希望曜日</div>

  <div class="weekday-group">

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="月">
      <span>月</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="火">
      <span>火</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="水">
      <span>水</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="木">
      <span>木</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="金">
      <span>金</span>
    </label>

    <label class="weekday-button">
      <input type="checkbox" name="desiredWeekdays" value="土">
      <span>土</span>
    </label>

  </div>
</div>

<div class="input-row">
  <label class="input-label" for="desiredStartTime">
    希望保育開始時間
  </label>

  <input
    type="time"
    id="desiredStartTime"
    step="300"
  >
</div>

<div class="input-row">
  <label class="input-label" for="desiredEndTime">
    希望保育終了時間
  </label>

  <input
    type="time"
    id="desiredEndTime"
    step="300"
  >
</div>

<div class="input-row">
  <div class="input-label">入園検討状況</div>

  <select id="considerationStatus">
    <option value="">選択してください</option>
    <option value="第一希望">第一希望</option>
    <option value="他園と比較検討中">他園と比較検討中</option>
    <option value="情報収集中">情報収集中</option>
    <option value="その他">その他</option>
  </select>
</div>
        <div class="section-title">
  04　保護者さま情報
</div>

<div class="info-row">
  <div class="info-label">保護者氏名</div>
  <div id="guardianNameDisplay" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">続柄</div>
  <div id="guardianRelationDisplay" class="info-value"></div>
</div>

<div class="info-row">
  <div class="info-label">電話番号</div>
  <div id="phoneDisplay" class="info-value"></div>
</div>

<div id="applicantWorkSection">

  <div class="subsection-title" id="applicantWorkTitle">
    保護者さまの就労情報
  </div>

  <div class="input-row">
    <label class="input-label" for="applicantWorkStatus">
      就労状況
    </label>

    <select id="applicantWorkStatus">
      <option value="">選択してください</option>
      <option value="就労中">就労中</option>
      <option value="育休中">育休中</option>
      <option value="求職中">求職中</option>
      <option value="就労予定">就労予定</option>
      <option value="就労していない">就労していない</option>
      <option value="その他">その他</option>
    </select>
  </div>


        <div id="applicantReturnDateArea" class="input-row conditional">
  <label class="input-label" for="applicantReturnDate">
    復職予定日
  </label>

  <input
    type="date"
    id="applicantReturnDate"
  >
</div>
  <div id="applicantWorkStartDateArea" class="input-row conditional">
  <label class="input-label" for="applicantWorkStartDate">
    就労開始予定日
  </label>

  <input
    type="date"
    id="applicantWorkStartDate"
  >
</div>

<div id="applicantWorkOtherArea" class="input-row conditional">
  <label class="input-label" for="applicantWorkOther">
    就労状況の詳細
  </label>

  <textarea
    id="applicantWorkOther"
    rows="3"
    placeholder="現在の状況をご記入ください"
  ></textarea>
</div>
<div id="applicantWorkDetails">
  <div class="input-row">
  <label class="input-label" for="applicantWorkPrefecture">
    勤務地（都道府県）
  </label>

  <select id="applicantWorkPrefecture">
    <option value="">選択してください</option>

     <optgroup label="関東">

        document.getElementById('error');

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        const profile =
          await liff.getProfile();


        status.textContent =
          'LINEとの接続に成功しました。';


        const url =
          API_URL +
          '?action=getVisitApplication' +
          '&lineUserId=' +
          encodeURIComponent(profile.userId);


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            '見学申込情報の取得に失敗しました。'
          );

        }


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.message ||
            '見学申込情報が見つかりませんでした。'
          );

        }


        showApplication(
          result.application
        );


        loading.style.display =
          'none';


      } catch (error) {

        console.error(error);

        loading.style.display =
          'none';

        errorBox.style.display =
          'block';

        errorBox.textContent =
          error.message ||
          '情報の取得中にエラーが発生しました。';

      }

    }

    function formatDate(value) {

      if (!value) {
        return '—';
      }

      const parts =
        value.split('-');

      if (parts.length !== 3) {
        return value;
      }

      return (
        Number(parts[0]) +
        '年' +
        Number(parts[1]) +
        '月' +
        Number(parts[2]) +
        '日'
      );

    }

function showOtherNurseries(currentNursery) {

  const nurseryList = [
    'トータス保育園 南花畑園',
    'トータス保育園 保木間園',
    'トータス保育園 梅島園',
    'ちびっこランド 六町園'
  ];

  const container =
    document.getElementById('otherNurseryChoices');

  container.innerHTML = '';


  nurseryList.forEach(function(nursery) {

    if (nursery === currentNursery) {
      return;
    }

    const label =
      document.createElement('label');

    label.className =
      'choice-button';

    label.innerHTML =
      '<input type="checkbox" ' +
      'name="otherNurseries" ' +
      'value="' + nursery + '">' +
      '<span>' + nursery + '</span>';

    container.appendChild(label);

  });


  // 特になし
  const noneLabel =
    document.createElement('label');

  noneLabel.className =
    'choice-button';

  noneLabel.innerHTML =
    '<input type="checkbox" ' +
    'name="otherNurseries" ' +
    'value="特になし" ' +
    'id="otherNurseryNone">' +
    '<span>特になし</span>';

  container.appendChild(noneLabel);


  // 「特になし」と園名は同時選択させない
  const choices =
    container.querySelectorAll(
      'input[name="otherNurseries"]'
    );

  choices.forEach(function(input) {

    input.addEventListener('change', function() {

      if (
        this.value === '特になし' &&
        this.checked
      ) {

        choices.forEach(function(item) {

          if (item.value !== '特になし') {
            item.checked = false;
          }

        });

      } else if (
        this.value !== '特になし' &&
        this.checked
      ) {

        const none =
          document.getElementById(
            'otherNurseryNone'
          );

        none.checked = false;

      }

    });

  });

}
